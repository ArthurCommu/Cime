<!doctype html>
<!--
  Page de développement de la scène (lecture seule). La page de Cime monte la scène elle-même (scene.js).
  Se sert avec le proxy de lecture, depuis la racine du dépôt :
    node src/cime/scene/outils/proxy-lecture.mjs --hote <adresse de l'hôte>
  puis ouvrir l'adresse qu'il affiche (les modules ES exigent http).
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cime — la scène</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cime — la scène</h1>
    <p class="bandeau">lecture seule — le direct de l’hôte</p>
  </header>
  <main>
    <p id="statut" role="status" hidden></p>
    <p id="infobulle" role="status"></p>
    <p id="ouverture" role="status" hidden></p>
    <div id="port"></div>
    <details>
      <summary>Légende</summary>
      <div id="legende"></div>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
